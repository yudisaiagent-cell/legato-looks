<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legato · מילים עם הסבר</title>
<style>
  body { margin: 0; background: #000; color: #fff; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 12px 48px; }
  h1 { font-size: 24px; line-height: 1.2; margin: 0 0 6px; }
  .sub { color: #b4b4b4; margin: 0 0 28px; }
  section { margin-bottom: 40px; }
  h2 { font-size: 19px; margin: 0 0 4px; }
  .line { color: #b4b4b4; margin: 0 0 12px; }
  img { width: 100%; display: block; border-radius: 12px; background: #111; }
</style>
</head>
<body>
<main>
  <h1>מילים עם הסבר · ארבע אפשרויות</h1>
  <p class="sub">המילים שלחיצה עליהן פותחת הסבר. למעלה איך שזה היום, ומתחת שלוש אפשרויות חדשות. אותו שיעור בכל אחת.</p>
  <section>
    <h2>ארבעת האקורדים הראשונים</h2>
    <p class="line">היום: קו מנוקד בפליז. א: רקע אפור עדין. ב: קו אפור רציף. ג: רקע פליז עדין.</p>
    <img src="terms-chords.png" alt="ארבע האפשרויות בשיעור ארבעת האקורדים">
  </section>
  <section>
    <h2>תו שמאל, אקורד ימין</h2>
    <p class="line">אותן ארבע, בשיעור אחר.</p>
    <img src="terms-rhythm.png" alt="ארבע האפשרויות בשיעור תו שמאל, אקורד ימין" loading="lazy">
  </section>
</main>
</body>
</html>
