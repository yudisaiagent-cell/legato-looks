</div></div><figcaption class="iso-legend"><span class="iso-caption">המרחקים מקוצרים והירח קצת מוגדל, כדי שהכול ייכנס למסך. ההארה, הנטייה של ציר כדור הארץ (23.5°) ושל מסלול הירח (5°) והקצב של החודש לפי הרמב״ם אמיתיים. כדור הארץ מוצג בלי הסיבוב היומי. המפות: NASA.</span></figcaption></figure></main><script type="module">// The model behind the tellurion: mean (uniform) motions, as in the
// calendar of Rambam, Hilchot Kiddush HaChodesh 6. Pure, no DOM.
const PARTS_PER_HOUR = 1080;
const SYNODIC = 29 + (12 + 793 / PARTS_PER_HOUR) / 24; // 29d 12h 793p
const YEAR = 365.25; // shnat Shmuel: 365d 6h
const SIDEREAL = 1 / (1 / SYNODIC + 1 / YEAR);
const VISIBLE_AT = 12; // degrees from the sun: first crescent in this model
const MAZALOT = ["טלה", "שור", "תאומים", "סרטן", "אריה", "בתולה", "מאזניים", "עקרב", "קשת", "גדי", "דלי", "דגים"];

const mod = (value, by) => ((value % by) + by) % by;

// t: days since a mean molad at which the sun stands at the start of Taleh.
function stateAt(t) {
  const sun = mod((360 * t) / YEAR, 360);
  let age = mod(t, SYNODIC);
  if (age > SYNODIC - 1e-4) age = 0; // a molad reached from below
  const elong = (360 * age) / SYNODIC;
  const moon = mod(sun + elong, 360);
  const lastMolad = t - age;
  return {
    t,
    sun,
    moon,
    earth: mod(sun + 180, 360),
    elong,
    age,
    lastMolad,
    moladSun: mod((360 * lastMolad) / YEAR, 360),
    lit: (1 - Math.cos((elong * Math.PI) / 180)) / 2,
  };
}

// days -> { d, h, p }: days, hours and chalakim (1080 per hour)
function dhp(days) {
  const parts = Math.round(days * 24 * PARTS_PER_HOUR);
  const d = Math.floor(parts / (24 * PARTS_PER_HOUR));
  const rest = parts - d * 24 * PARTS_PER_HOUR;
  const h = Math.floor(rest / PARTS_PER_HOUR);
  return { d, h, p: rest - h * PARTS_PER_HOUR };
}

function mazalOf(longitude) {
  return MAZALOT[Math.floor(mod(longitude, 360) / 30)];
}

function phaseOf(elong) {
  if (elong < 6 || elong >= 354) return "מולד: הירח בין כדור הארץ לשמש";
  if (elong < VISIBLE_AT) return "אחרי המולד: עוד צמוד לשמש ולא נראה";
  if (elong < 84) return "סהר שהולך וגדל, נראה במערב בערב";
  if (elong < 96) return "רבע ראשון: חצי מואר";
  if (elong < 174) return "יותר מחצי מואר, הולך ומתמלא";
  if (elong < 186) return "מילוא: ירח מלא, מול השמש";
  if (elong < 264) return "מתחיל לחסור";
  if (elong < 276) return "רבע אחרון: חצי מואר";
  return "סהר שהולך וקטן, נראה רק לפנות בוקר";
}

const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const len = (a) => Math.hypot(a[0], a[1], a[2]);
const norm = (a) => mul(a, 1 / (len(a) || 1));
const wrap = (x, m) => ((x % m) + m) % m;

const AXIS = v3(0, Math.sin(M.TILT), Math.cos(M.TILT));
const AX1 = v3(1, 0, 0);
const AX2 = cross(AXIS, AX1);
const nodeAt = (t) => wrap(M.NODE0 - (360 * t) / M.NODE_DAYS, 360);
const latAt = (lam, t) => Math.asin(Math.sin(M.INC) * Math.sin((lam - nodeAt(t)) * RAD)) / RAD;

function sceneAt(t) {
  const st = stateAt(t);
  const le = st.earth * RAD;
  const E = v3(M.SUN_D * Math.cos(le), M.SUN_D * Math.sin(le), 0);
  const b = latAt(st.moon, t) * RAD;
  const lm = st.moon * RAD;
  const Mo = add(E, v3(M.RM * Math.cos(b) * Math.cos(lm), M.RM * Math.cos(b) * Math.sin(lm), M.RM * Math.sin(b)));
  const L = norm(mul(E, -1));
  const R = Math.atan2(dot(L, AX2), dot(L, AX1)) - M.NOON_LON;
  const EB1 = add(mul(AX1, Math.cos(R)), mul(AX2, Math.sin(R)));
  const EB2 = add(mul(AX1, -Math.sin(R)), mul(AX2, Math.cos(R)));
  const toE = sub(E, Mo);
  const MB1 = norm(v3(toE[0], toE[1], 0));
  const MB2 = cross(v3(0, 0, 1), MB1);
  return { st, E, Mo, L, EB1, EB2, MB1, MB2 };
}

const stage = document.querySelector(".r3-stage");
const gl3 = stage.querySelector("canvas.r3-gl");
const over = stage.querySelector("canvas.r3-over");
const octx = over.getContext("2d");
const readout = document.querySelector("[data-readout]");
const say = document.querySelector("[data-say]");
const playB = document.querySelector("[data-play]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const days = (d) => (d === 1 ? "יום אחד" : `${d} ימים`);
const hours = (h) => (h === 1 ? "שעה אחת" : `${h} שעות`);

// ---------- WebGL ----------
const gl = gl3.getContext("webgl", { antialias: false });
if (!gl) stage.classList.add("r3-nogl");
const VS = `attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;
const FS = `
precision highp float;
uniform vec2 uRes, uOff; uniform vec3 uCam, uRight, uUp, uFwd; uniform float uTan, uInset;
uniform vec3 uSun, uEarth, uMoon, uL; uniform float uMoonR, uSunR;
uniform vec3 uEB1, uEB2, uEN, uMB1, uMB2;
uniform sampler2D uDay, uNight, uLuna;
const float PI = 3.14159265;
float hit(vec3 ro, vec3 rd, vec3 c, float r){ vec3 oc = ro - c; float b = dot(oc, rd); float h = b*b - (dot(oc, oc) - r*r); if (h < 0.) return -1.; float t = -b - sqrt(h); return t > 0. ? t : -1.; }
float hash(vec3 p){ p = fract(p*0.3183099 + vec3(.1,.17,.13)); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
vec3 lin(vec3 c){ return c*c; }
vec2 uvOf(vec3 n, vec3 b1, vec3 b2, vec3 ax){ return vec2(atan(dot(n,b2), dot(n,b1))/(2.*PI)+.5, .5 - asin(clamp(dot(n,ax),-1.,1.))/PI); }
vec3 stars(vec3 rd){
  vec3 p = rd * 160.; vec3 id = floor(p); vec3 f = fract(p) - .5;
  float h = hash(id); if (h < .978) return vec3(0.);
  vec3 o = (vec3(hash(id+1.7), hash(id+3.1), hash(id+5.3)) - .5) * .5;
  return smoothstep(.1, 0., length(f - o)) * (h - .978) * 30. * vec3(.85,.9,1.);
}
void main(){
  vec2 q = ((gl_FragCoord.xy - uOff) / uRes) * 2. - 1.;
  if (uInset > .5 && length(q) > 1.) discard;
  vec3 rd = normalize(uFwd + q.x * uTan * (uRes.x/uRes.y) * uRight + q.y * uTan * uUp);
  vec3 ro = uCam;
  float tS = uInset > .5 ? -1. : hit(ro, rd, uSun, uSunR);
  float tE = uInset > .5 ? -1. : hit(ro, rd, uEarth, 1.);
  float tM = hit(ro, rd, uMoon, uMoonR);
  float t = 1e9; int k = 0;
  if (tS > 0. && tS < t) { t = tS; k = 1; }
  if (tE > 0. && tE < t) { t = tE; k = 2; }
  if (tM > 0. && tM < t) { t = tM; k = 3; }
  vec3 col = stars(rd);
  if (k == 1) {
    vec3 n = normalize(ro + rd*t - uSun);
    col = vec3(1., .8, .45) * (.6 + .4*pow(max(dot(n, -rd), 0.), .45)) * 8.;
  } else if (k == 2) {
    vec3 n = normalize(ro + rd*t - uEarth);
    vec2 uv = uvOf(n, uEB1, uEB2, uEN);
    vec3 day = lin(texture2D(uDay, uv).rgb);
    vec3 night = lin(texture2D(uNight, uv).rgb);
    float d = dot(n, uL);
    float ocean = smoothstep(.04, .14, day.b - max(day.r, day.g));
    float spec = pow(max(dot(n, normalize(uL - rd)), 0.), 60.) * ocean * max(d, 0.) * 1.5;
    col = day * max(d, 0.) * 2.6 + vec3(1.,.95,.85) * spec;
    col += night * vec3(1.,.8,.5) * 1.3 * (1. - smoothstep(-.18, .04, d));
    col += vec3(.25,.5,1.) * pow(1. - max(dot(n, -rd), 0.), 2.6) * smoothstep(-.25, .5, d) * .9;
    col += day * .015;
  } else if (k == 3) {
    vec3 n = normalize(ro + rd*t - uMoon);
    vec3 alb = lin(texture2D(uLuna, uvOf(n, uMB1, uMB2, vec3(0.,0.,1.))).rgb);
    float d = dot(n, uL);
    float ls = d > 0. ? 2.*d/(d + max(dot(n, -rd), 0.) + .05) : 0.;
    col = alb * ls * 1.7;
    vec3 toE = normalize(uEarth - uMoon);
    col += alb * max(dot(n, toE), 0.) * (.5 + .5*dot(uL, -toE)) * .035;
  }
  if (uInset < .5) {
    vec3 oc = ro - uEarth; float b = dot(oc, rd); vec3 cp = ro + rd*max(-b, 0.) - uEarth; float m = length(cp);
    if (k != 1 && (k == 0 || t > -b) && m > 1. && m < 1.06) col += vec3(.3,.55,1.) * smoothstep(1.06, 1., m) * smoothstep(-.3, .3, dot(normalize(cp), uL)) * .55;
    vec3 toS = uSun - ro; float ds = length(toS); toS /= ds;
    float ang = atan(length(cross(rd, toS)), dot(rd, toS));
    float ar = asin(clamp(uSunR/ds, 0., 1.));
    if (k != 1 && dot(rd, toS) > 0.) col += vec3(1., .72, .38) * .9 * pow(ar / max(ang, ar), 2.2) * (k == 0 ? 1. : .3);
  }
  col = sqrt(1. - exp(-col * 1.1));
  col += (hash(vec3(gl_FragCoord.xy, 1.)) - .5) / 255.;
  gl_FragColor = vec4(col, 1.);
}`;
const U = {};
let loaded = 0;
function shader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function texture(unit, src) {
  const tex = gl.createTexture();
  const img = new Image();
  img.onload = () => {
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    loaded++;
    run(true);
  };
  img.src = src;
}
if (gl) {
  const prog = gl.createProgram();
  gl.attachShader(prog, shader(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "p");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  "uRes uOff uCam uRight uUp uFwd uTan uInset uSun uEarth uMoon uL uMoonR uSunR uEB1 uEB2 uEN uMB1 uMB2 uDay uNight uLuna".split(" ").forEach((n) => (U[n] = gl.getUniformLocation(prog, n)));
  gl.uniform1i(U.uDay, 0);
  gl.uniform1i(U.uNight, 1);
  gl.uniform1i(U.uLuna, 2);
  texture(0, D.tex.day);
  texture(1, D.tex.night);
  texture(2, D.tex.moon);
}

// ---------- camera: turns with the sun, so the sun stays put while the moon goes round ----------
const cam = { yaw: Math.PI, pitch: 1.28, dist: 28, fov: 38, sway: 0 };
let zoom = 1;
let t = 0.6;
let sc = sceneAt(t);
function mainCamera() {
  const sunAng = Math.atan2(sc.L[1], sc.L[0]);
  const target = add(sc.E, mul(sc.L, 3.3));
  const y = sunAng + cam.yaw + 0.42 * Math.sin(cam.sway);
  const cp = Math.cos(cam.pitch);
  const dir = v3(cp * Math.cos(y), cp * Math.sin(y), Math.sin(cam.pitch));
  const pos = add(target, mul(dir, cam.dist * zoom));
  const fwd = mul(dir, -1);
  const right = norm(cross(fwd, v3(0, 0, 1)));
  return { pos, fwd, right, up: cross(right, fwd), tanH: Math.tan((cam.fov * RAD) / 2) };
}
function insetCamera() {
  const look = norm(sub(sc.Mo, sc.E));
  const pos = add(sc.E, look);
  const right = norm(cross(look, v3(0, 0, 1)));
  const d = len(sub(sc.Mo, pos));
  return { pos, fwd: look, right, up: cross(right, look), tanH: (M.MOON_R / d) * 1.45 };
}

// ---------- overlay: the moon's path, names, the inset's frame ----------
function project(B, p, w, h) {
  const v = sub(p, B.pos);
  const z = dot(v, B.fwd);
  if (z <= 0.01) return null;
  return [w / 2 + (dot(v, B.right) / (z * B.tanH * (w / h))) * (w / 2), h / 2 - (dot(v, B.up) / (z * B.tanH)) * (h / 2)];
}
function hidden(B, p) {
  const v = sub(p, B.pos);
  const far = len(v);
  const rd = mul(v, 1 / far);
  for (const [c, r] of [[v3(0, 0, 0), M.SUN_R], [sc.E, 1], [sc.Mo, M.MOON_R]]) {
    if (len(sub(p, c)) <= r * 1.001) continue;
    const oc = sub(B.pos, c);
    const b = dot(oc, rd);
    const hh = b * b - (dot(oc, oc) - r * r);
    if (hh > 0 && -b - Math.sqrt(hh) > 0 && -b - Math.sqrt(hh) < far) return true;
  }
  return false;
}
function name(B, p, r, words, color, w, h) {
  const s = project(B, p, w, h);
  if (!s || hidden(B, p)) return;
  const top = project(B, add(p, mul(B.up, r)), w, h);
  const lift = top ? Math.abs(s[1] - top[1]) : 8;
  octx.font = "700 13px system-ui, -apple-system, 'Segoe UI', sans-serif";
  octx.textAlign = "center";
  octx.lineWidth = 3.5;
  octx.strokeStyle = "rgba(0,0,0,.8)";
  octx.fillStyle = color;
  octx.strokeText(words, s[0], s[1] - lift - 7);
  octx.fillText(words, s[0], s[1] - lift - 7);
}
let inset = { x: 0, y: 0, r: 0 };
function drawOverlay(B, w, h, dpr) {
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);
  octx.clearRect(0, 0, w, h + inset.band);
  // the moon's path: bright in front of the earth, hidden behind it
  octx.lineWidth = 1.2;
  octx.strokeStyle = "rgba(160,195,255,.6)";
  octx.beginPath();
  let on = false;
  for (let i = 0; i <= 160; i++) {
    const lam = (i / 160) * 360;
    const b = latAt(lam, t) * RAD;
    const p = add(sc.E, v3(M.RM * Math.cos(b) * Math.cos(lam * RAD), M.RM * Math.cos(b) * Math.sin(lam * RAD), M.RM * Math.sin(b)));
    const s = !hidden(B, p) && project(B, p, w, h);
    if (s) {
      on ? octx.lineTo(s[0], s[1]) : octx.moveTo(s[0], s[1]);
      on = true;
    } else on = false;
  }
  octx.stroke();
  name(B, v3(0, 0, 0), M.SUN_R, "השמש", "#ffd27a", w, h);
  name(B, sc.E, 1, "כדור הארץ", "#a9cbff", w, h);
  name(B, sc.Mo, M.MOON_R, "הירח", "#ffffff", w, h);
  // the inset's frame and title
  octx.lineWidth = 1.5;
  octx.strokeStyle = "rgba(255,255,255,.55)";
  octx.beginPath();
  octx.arc(inset.x, inset.y, inset.r, 0, TAU);
  octx.stroke();
  octx.strokeStyle = "rgba(255,255,255,.12)";
  octx.beginPath();
  octx.moveTo(0, h + 0.5);
  octx.lineTo(w, h + 0.5);
  octx.stroke();
  octx.font = "700 14px system-ui, -apple-system, 'Segoe UI', sans-serif";
  octx.fillStyle = "rgba(255,255,255,.92)";
  octx.textAlign = "right";
  const tx = inset.x - inset.r - 14;
  octx.fillText("כך הירח נראה", tx, inset.y - 4);
  octx.fillText("מכדור הארץ", tx, inset.y + 15);
}

// ---------- drawing ----------
let size = [0, 0, 1];
function resize() {
  const r = stage.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  const w = Math.max(1, Math.round(r.width));
  const h = Math.max(1, Math.round(r.height));
  if (w === size[0] && h === size[1] && dpr === size[2]) return;
  size = [w, h, dpr];
  for (const c of [gl3, over]) {
    c.width = Math.round(w * dpr);
    c.height = Math.round(h * dpr);
  }
  const band = Math.round(Math.min(w, h) * 0.3);
  const ir = Math.round(band * 0.4);
  inset = { x: w - ir - 18, y: h - band / 2, r: ir, band };
}
function pass(B, x, y, w, h, isInset) {
  gl.viewport(x, y, w, h);
  gl.uniform2f(U.uRes, w, h);
  gl.uniform2f(U.uOff, x, y);
  gl.uniform3fv(U.uCam, B.pos);
  gl.uniform3fv(U.uRight, B.right);
  gl.uniform3fv(U.uUp, B.up);
  gl.uniform3fv(U.uFwd, B.fwd);
  gl.uniform1f(U.uTan, B.tanH);
  gl.uniform1f(U.uInset, isInset ? 1 : 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
function render() {
  resize();
  const [w, h, dpr] = size;
  const B = mainCamera();
  if (gl && loaded >= 3) {
    gl.uniform3fv(U.uSun, v3(0, 0, 0));
    gl.uniform3fv(U.uEarth, sc.E);
    gl.uniform3fv(U.uMoon, sc.Mo);
    gl.uniform3fv(U.uL, sc.L);
    gl.uniform1f(U.uMoonR, M.MOON_R);
    gl.uniform1f(U.uSunR, M.SUN_R);
    gl.uniform3fv(U.uEB1, sc.EB1);
    gl.uniform3fv(U.uEB2, sc.EB2);
    gl.uniform3fv(U.uEN, AXIS);
    gl.uniform3fv(U.uMB1, sc.MB1);
    gl.uniform3fv(U.uMB2, sc.MB2);
    const bandPx = Math.round(inset.band * dpr);
    gl.enable(gl.SCISSOR_TEST);
    gl.scissor(0, 0, gl3.width, bandPx);
    gl.clearColor(0.02, 0.02, 0.025, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.disable(gl.SCISSOR_TEST);
    pass(B, 0, bandPx, gl3.width, gl3.height - bandPx, false);
    const s = Math.round(inset.r * 2 * dpr);
    pass(insetCamera(), Math.round((inset.x - inset.r) * dpr), gl3.height - Math.round((inset.y + inset.r) * dpr), s, s, true);
  }
  drawOverlay(B, w, h - inset.band, dpr);
}

// ---------- what to say ----------
function sentence(e) {
  if (e < 6 || e >= 354) return D.say.molad;
  if (e < 30) return D.say.seen;
  if (e < 80) return D.say.waxing;
  if (e < 100) return D.say.first;
  if (e < 170) return D.say.gibbous;
  if (e < 190) return D.say.full;
  if (e < 260) return D.say.waning;
  if (e < 280) return D.say.last;
  return D.say.old;
}

// ---------- time and motion ----------
let playing = !still.matches;
const RATE = 1.6; // days per second: a month in about 18 seconds
let target = null;
let vmax = 1;
let touched = 0;
let frame = 0;
let visible = false;
let last = 0;
let force = false;
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 20) : 1 / 60;
  last = now;
  if (target !== null) {
    const diff = target - t;
    let v = Math.max(-vmax, Math.min(vmax, diff / 0.5));
    const floor = Math.min(0.4, Math.abs(diff) / dt);
    if (Math.abs(v) < floor) v = Math.sign(diff) * floor;
    t += v * dt;
    if (Math.abs(target - t) < 1e-4 || still.matches) {
      t = target;
      target = null;
    }
  } else if (playing) t += RATE * dt;
  if (!still.matches && !pointers.size && now - touched > 4000) cam.sway += dt * 0.35;
  sc = sceneAt(t);
  render();
  const a = dhp(sc.st.age);
  if (readout.textContent !== `${days(a.d)}, ${hours(a.h)} מהמולד`) readout.textContent = `${days(a.d)}, ${hours(a.h)} מהמולד`;
  const words = sentence(sc.st.elong);
  if (say.innerHTML !== words) say.innerHTML = words;
  const busy = playing || target !== null || (!still.matches && !pointers.size) || force;
  force = false;
  frame = visible && busy ? requestAnimationFrame(tick) : 0;
}
function run(again = false) {
  if (again) force = true;
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
}

// drag to turn, pinch or wheel to come closer
const pointers = new Map();
let pinch0 = 0;
let zoom0 = 1;
stage.addEventListener("pointerdown", (e) => {
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  stage.setPointerCapture(e.pointerId);
  touched = performance.now();
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinch0 = Math.hypot(a[0] - b[0], a[1] - b[1]);
    zoom0 = zoom;
  }
});
stage.addEventListener("pointermove", (e) => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  touched = performance.now();
  if (pointers.size === 1) {
    cam.yaw -= (e.clientX - prev[0]) * 0.009;
    cam.pitch = Math.max(-1.35, Math.min(1.4, cam.pitch + (e.clientY - prev[1]) * 0.009));
  } else if (pointers.size === 2 && pinch0 > 0) {
    const [a, b] = [...pointers.values()];
    zoom = Math.max(0.35, Math.min(2.2, (zoom0 * pinch0) / Math.max(10, Math.hypot(a[0] - b[0], a[1] - b[1]))));
  }
  run(true);
});
const lift = (e) => {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch0 = 0;
  touched = performance.now();
  run(true);
};
stage.addEventListener("pointerup", lift);
stage.addEventListener("pointercancel", lift);
stage.addEventListener("wheel", (e) => {
  e.preventDefault();
  zoom = Math.max(0.35, Math.min(2.2, zoom * Math.exp(e.deltaY * 0.0012)));
  run(true);
}, { passive: false });
stage.addEventListener("keydown", (e) => {
  const s = { ArrowLeft: [0.1, 0], ArrowRight: [-0.1, 0], ArrowUp: [0, 0.08], ArrowDown: [0, -0.08] }[e.key];
  if (!s) return;
  e.preventDefault();
  touched = performance.now();
  cam.yaw += s[0];
  cam.pitch = Math.max(-1.35, Math.min(1.4, cam.pitch + s[1]));
  run(true);
});

function setPlaying(on) {
  playing = on;
  playB.textContent = on ? "⏸ עצור" : "▶ המשך";
  playB.setAttribute("aria-pressed", String(on));
  run(true);
}
const AT = { molad: 0, seen: 12, first: 90, full: 180, last: 270 };
document.querySelectorAll("[data-event]").forEach((b) =>
  b.addEventListener("click", () => {
    const st = stateAt(t);
    let at = st.lastMolad + (AT[b.dataset.event] / 360) * SYNODIC;
    if (at <= t + 0.02) at += SYNODIC;
    setPlaying(false);
    target = at;
    vmax = Math.max(1, (at - t) / 1.6);
    document.querySelectorAll("[data-event]").forEach((x) => x.toggleAttribute("data-on", x === b));
    run(true);
  }),
);
playB.addEventListener("click", () => {
  document.querySelectorAll("[data-event]").forEach((x) => x.removeAttribute("data-on"));
  setPlaying(!playing);
});
new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run(true);
}, { rootMargin: "100px 0px" }).observe(stage);
addEventListener("resize", () => run(true));
setPlaying(playing);
</script></body></html>
