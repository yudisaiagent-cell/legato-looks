<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>סגנונות לסרטון</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    background: #111;
    color: #eee;
    font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 8px 0 4px; }
  .lead { color: #aaa; margin: 0 0 20px; }
  figure { margin: 0 0 28px; }
  img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 1376 / 768;
    border-radius: 12px;
    background: #222;
  }
  figcaption { padding: 10px 2px 0; }
  figcaption b { font-size: 1.15rem; display: block; }
  figcaption span { color: #bbb; }
  .note {
    border-right: 3px solid #e0b84a;
    padding: 4px 12px;
    color: #ccc;
    margin-top: 8px;
  }
</style>
</head>
<body>
<main>
  <h1>סגנונות לסרטון</h1>
  <p class="lead">אותה סצנה בשלושה סגנונות. תגיד לי איזה מהם, או מה לשנות.</p>

  <figure>
    <img src="1-3d.jpg" alt="שני גברים מתווכחים ברחוב, בסגנון אנימציה תלת־ממדית" loading="eager">
    <figcaption>
      <b>1. תלת־ממד</b>
      <span>תאורה רכה, פנים עם הרבה הבעה. בסגנון הזה כלי הווידאו הכי יציבים.</span>
    </figcaption>
  </figure>

  <figure>
    <img src="2-comic.jpg" alt="שני גברים מתווכחים ברחוב, בסגנון קומיקס" loading="lazy">
    <figcaption>
      <b>2. קומיקס</b>
      <span>קווי דיו עבים, נקודות דפוס, זווית דרמטית.</span>
    </figcaption>
  </figure>

  <figure>
    <img src="3-hybrid.jpg" alt="שני גברים מתווכחים ברחוב, שילוב של תלת־ממד וקומיקס" loading="lazy">
    <figcaption>
      <b>3. שילוב</b>
      <span>יצא יותר קרוב לקומיקס ממה שתכננתי: מצויר, עם קצת עומק.</span>
    </figcaption>
  </figure>

  <p class="note">שים לב: הדמויות לא יצאו זהות בין התמונות, למשל הצבע של העור והמעיל. בסרטון עצמו נפתור את זה עם "דף דמות" קבוע לכל אחד.</p>
</main>
</body>
</html>
